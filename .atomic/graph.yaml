# Default atomic workflow graph (installed to .atomic/graph.yaml)
version: 1
nodes:
  router:
    next: [lite, explore]
  lite:
    skill: atomic-lite
    executor: cursor-subagent
  explore:
    skill: atomic-explore
    executor: cursor-subagent
    agent: explorer
  plan:
    skill: atomic-plan
    executor: cursor-subagent
    agent: planner
  plan-review:
    skill: atomic-plan
    executor: cursor-subagent
    agent: plan-reviewer
  task:
    skill: atomic-task
    executor: cursor-subagent
    agent: tasker
  execute:
    skill: atomic-execute
    executor: cursor-subagent
    agent: worker
  review:
    skill: atomic-review
    executor: cursor-subagent
    agent: atomic-reviewer
  wrapup:
    skill: atomic-wrapup
    executor: cursor-subagent
    agent: tester
  memory:
    skill: atomic-workflow
    executor: cursor-subagent
    agent: memory-curator
