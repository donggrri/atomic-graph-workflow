version: 2
defaults: { executor: cursor-subagent, timeout: 900, max_visits: 3 }
limits: { max_steps: 30, max_loops: { execute: 3, spec: 2 } }
gates:
  db: { match: [db/**, migrations/**] }
  auth: { match: [auth/**, src/auth/**] }
  merge: { always: true }
  ci: { match: [.github/workflows/**] }
  deps: { match: [package.json, package-lock.json, requirements*.txt, go.mod, Cargo.toml] }
entry: { default: router, by_class: { bug: explore, feature: spec, refactor: plan, trivial: lite, docs: spec } }
nodes:
  router: { skill: cursor-atomic-router, executor: cursor-subagent }
  explore: { skill: cursor-atomic-explore, executor: cursor-subagent, agent: explorer }
  spec: { skill: cursor-atomic-spec, executor: cursor-subagent, timeout: 900, inputs: [brief], outputs: [SPEC.md] }
  spec-review: { skill: cursor-atomic-spec-review, executor: cursor-subagent, agent: spec-reviewer }
  plan: { skill: cursor-atomic-plan, executor: cursor-subagent, agent: planner }
  plan-review: { skill: cursor-atomic-plan, executor: cursor-subagent, agent: plan-reviewer }
  task: { skill: cursor-atomic-task, executor: cursor-subagent, agent: tasker }
  execute: { skill: cursor-atomic-execute, executor: cursor-subagent, agent: worker }
  review: { skill: cursor-atomic-review, executor: cursor-subagent, agent: cursor-atomic-reviewer }
  security-scan: { skill: security-scan, executor: opencode, timeout: 600, inputs: [diff], outputs: [SECURITY.md], requires_approval: [] }
  test: { skill: cursor-atomic-test, executor: cursor-subagent, inputs: [diff], outputs: [TEST.md] }
  wrapup: { skill: cursor-atomic-wrapup, executor: cursor-subagent, agent: tester }
  lite: { skill: cursor-atomic-lite, executor: cursor-sdk }
  memory: { skill: cursor-atomic-workflow, executor: cursor-subagent, agent: memory-curator }
edges:
  - { from: router, to: [lite, explore], on: route }
  - { from: explore, to: spec, on: pass }
  - { from: explore, to: $user, on: escalate }
  - { from: spec, to: spec-review, on: pass }
  - { from: spec, to: spec, on: fail }
  - { from: spec, to: $user, on: escalate }
  - { from: spec-review, to: plan, on: pass }
  - { from: spec-review, to: spec, on: spec_mismatch }
  - { from: spec-review, to: explore, on: needs_info }
  - { from: plan, to: plan-review, on: pass }
  - { from: plan-review, to: task, on: pass }
  - { from: plan-review, to: plan, on: fail }
  - { from: task, to: execute, on: pass }
  - { from: execute, to: review, on: pass }
  - { from: execute, to: task, on: needs_info }
  - { from: review, to: security-scan, on: pass }
  - { from: review, to: execute, on: fail }
  - { from: security-scan, to: test, on: pass }
  - { from: security-scan, to: review, on: fail }
  - { from: test, to: wrapup, on: pass }
  - { from: test, to: execute, on: fail }
  - { from: wrapup, to: memory, on: pass }
  - { from: memory, to: $end, on: pass }
  - { from: lite, to: $end, on: pass }
