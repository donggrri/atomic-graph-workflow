# Default atomic workflow graph (installed to .atomic/graph.yaml)
version: 2
defaults: { executor: cursor-subagent, timeout: 900, max_visits: 3 }
limits: { max_steps: 30 }
entry: { default: router }
nodes:
  router: { skill: atomic-router }
  lite: { skill: atomic-lite, executor: cursor-subagent }
  explore: { skill: atomic-explore, agent: explorer, executor: cursor-subagent }
  plan: { skill: atomic-plan, agent: planner, executor: cursor-subagent }
  plan-review: { skill: atomic-plan, agent: plan-reviewer, executor: cursor-subagent }
  task: { skill: atomic-task, agent: tasker, executor: cursor-subagent }
  execute: { skill: atomic-execute, agent: worker, executor: cursor-subagent }
  review: { skill: atomic-review, agent: atomic-reviewer, executor: cursor-subagent }
  wrapup: { skill: atomic-wrapup, agent: tester, executor: cursor-subagent }
  memory: { skill: atomic-workflow, agent: memory-curator, executor: cursor-subagent }
edges:
  - { from: router, to: [lite, explore], on: route }
  - { from: explore, to: plan, on: pass }
  - { from: plan, to: plan-review, on: pass }
  - { from: plan-review, to: task, on: pass }
  - { from: plan-review, to: plan, on: fail }
  - { from: task, to: execute, on: pass }
  - { from: execute, to: review, on: pass }
  - { from: review, to: wrapup, on: pass }
  - { from: review, to: execute, on: fail }
  - { from: wrapup, to: memory, on: pass }
  - { from: memory, to: "$end", on: pass }
  - { from: lite, to: "$end", on: pass }
